# Validates and builds the site on every push. Pushes to the repository's default branch
# (and manual runs on it) also publish the build to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Site

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  # never cancel a deployment that is already publishing; feature-branch builds can be superseded
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate lesson content against the operator database
        run: npm run validate
      - run: npm run build
      - name: Upload site
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # fails with a clear message if Pages has not been enabled for the repository yet
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
